name: CI/CD Automated Test & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. 자동화 검증 및 보안/성능 테스트 파이프라인
  verify-and-test:
    name: 🛡️ Security & Performance Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      # Python 백엔드 설정
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🚀 Run Admin Commercial Readiness Test Suite
        working-directory: ./backend
        run: |
          python scripts/test_admin_commercial_readiness.py

      - name: ⚔️ Run Red Team Penetration Testing Suite
        working-directory: ./backend
        run: |
          python scripts/red_team_attack_suite.py

      # Node.js 프론트엔드 설정
      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: 🏗️ Verify Frontend Production Build
        working-directory: ./frontend
        run: npm run build

  # 2. 프로덕션 자동 배포 파이프라인
  auto-deploy:
    name: 🚀 Production Auto Deployment
    needs: verify-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Build and Verify Docker Compose Stack
        run: |
          docker compose config

      - name: 🎉 Deployment Status Notification
        run: |
          echo "======================================================="
          echo "✅ 모든 검증 및 보안 테스트를 통과했습니다."
          echo "🚀 인스타그램 클론 서비스가 프로덕션 환경에 자동 배포 준비되었습니다."
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "======================================================="
